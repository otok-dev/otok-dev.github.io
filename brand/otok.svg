    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="#1F3A5F"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#F2B33D" stroke-width="12" mask="url(#cut)"/>
  <path d="M17 35 C 32 35, 38 50, 52 50 H80 M17 65 C 32 65, 38 50, 52 50 M68 38 L81 50 L68 62" fill="none" stroke="#FFF8E7" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
